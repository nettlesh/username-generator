<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Random usernames from EFF's word lists, made in your browser."
    />
    <title>Username generator</title>
    <!-- Applies a saved theme before the page draws, so it never flashes the other one. -->
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Username generator</h1>
        <nav>
          <button id="theme" type="button" role="switch" aria-label="Dark mode">
            <span data-icon="sun"></span>
            <span data-icon="moon"></span>
          </button>
          <!-- The GitHub mark is from Simple Icons, https://simpleicons.org, under CC0. -->
          <a
            class="icon"
            href="https://github.com/nettlesh/username-generator"
            aria-label="Source on GitHub"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
              />
            </svg>
          </a>
        </nav>
      </header>

      <section class="result" aria-label="Username">
        <output id="username" aria-live="polite"></output>
        <span id="dino" aria-hidden="true" hidden></span>
        <div class="actions">
          <span id="length"></span>
          <p id="error" role="alert" hidden></p>
          <button id="copy" class="secondary" type="button">
            <span data-icon="copy"></span>
            <span>Copy</span>
          </button>
          <button form="options" class="primary">
            <span data-icon="dices"></span>
            <span>Generate</span>
          </button>
        </div>
      </section>

      <!-- One grid for every row: labels, sliders, then character sets, so all line up. -->
      <form id="options">
        <div class="row" role="group" aria-labelledby="start-label">
          <span class="label" id="start-label">Start</span>
          <span class="range" data-name="start"></span>
          <span class="chips">
            <label><input type="checkbox" name="start" value="0-9" checked />0-9</label>
            <label><input type="checkbox" name="start" value="a-z" />a-z</label>
            <label><input type="checkbox" name="start" value="A-Z" />A-Z</label>
          </span>
        </div>

        <div
          class="row connector"
          role="radiogroup"
          aria-label="Start and end: and uses both, or uses one of them, chosen at random"
          title="Or uses only one of start and end, chosen at random"
        >
          <span class="chips">
            <label><input type="radio" name="ends" value="both" checked />and</label>
            <label><input type="radio" name="ends" value="either" />or</label>
          </span>
        </div>

        <div class="row" role="group" aria-labelledby="end-label">
          <span class="label" id="end-label">End</span>
          <span class="range" data-name="end"></span>
          <span class="chips">
            <label><input type="checkbox" name="end" value="0-9" checked />0-9</label>
            <label><input type="checkbox" name="end" value="a-z" />a-z</label>
            <label><input type="checkbox" name="end" value="A-Z" />A-Z</label>
          </span>
        </div>

        <div class="row" role="group" aria-labelledby="anywhere-label">
          <span class="label" id="anywhere-label">Anywhere</span>
          <span class="range" data-name="anywhere"></span>
          <span class="chips">
            <label><input type="checkbox" name="anywhere" value="0-9" checked />0-9</label>
            <label><input type="checkbox" name="anywhere" value="a-z" />a-z</label>
            <label><input type="checkbox" name="anywhere" value="A-Z" />A-Z</label>
          </span>
        </div>

        <div class="row" role="group" aria-labelledby="words-label">
          <span class="label" id="words-label">Words</span>
          <span class="range" data-name="words" data-value="1"></span>
          <span class="wide">
            <span class="chips">
              <label><input type="radio" name="case" value="lower" checked />lower</label>
              <label><input type="radio" name="case" value="capitalized" />Capitalized</label>
              <label><input type="radio" name="case" value="upper" />UPPER</label>
              <label><input type="radio" name="case" value="random" />rAnDoM</label>
            </span>
            <span class="chips">
              <label><input type="checkbox" name="leetspeak" />l33tsp34k</label>
            </span>
          </span>
        </div>

        <div class="row" role="group" aria-labelledby="separator-label">
          <span class="label" id="separator-label">Separator</span>
          <span class="chips wide">
            <label><input type="radio" name="separator" value="" checked />none</label>
            <label><input type="radio" name="separator" value="-" />-</label>
            <label><input type="radio" name="separator" value="." />.</label>
            <label><input type="radio" name="separator" value="_" />_</label>
            <label><input type="radio" name="separator" value="random" />random</label>
          </span>
          <span id="between" class="group" hidden>
            <span class="range" data-name="between"></span>
            <span class="chips">
              <label><input type="checkbox" name="between" value="0-9" checked />0-9</label>
              <label><input type="checkbox" name="between" value="a-z" />a-z</label>
              <label><input type="checkbox" name="between" value="A-Z" />A-Z</label>
            </span>
          </span>
        </div>

        <div class="row" role="group" aria-labelledby="lists-label">
          <span class="label" id="lists-label">Word lists</span>
          <span class="chips wide lists" id="word-lists"></span>
          <button type="reset" class="reset">
            <span data-icon="rotate-ccw"></span>
            <span>Reset</span>
          </button>
        </div>
      </form>
    </main>

    <footer><p id="credit"></p></footer>
  </body>
</html>
