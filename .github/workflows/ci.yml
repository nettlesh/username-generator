name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the tools in mise.lock; --locked is added because the lockfile exists.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          minimum_release_age: 7d
      - name: Install project dependencies
        run: mise run install --no-hooks
      - name: Check
        run: mise run check
        env:
          # pinact verifies action pins against the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Test
        run: mise run test
